name: quality

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  contract-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check CLI syntax
        run: node --check bin/contract.mjs
      - name: Run CLI regression tests
        run: npm test
